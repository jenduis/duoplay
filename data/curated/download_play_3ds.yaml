# Curated 3DS / DS single-card Download Play multiplayer.
#
# Every entry here sets coop.downloadPlay = true in the final dataset (precedence: above Co-Optimus).
# Fields:
#   title, platform (3ds|ds), downloadPlay, maxPlayers, mode (coop|versus|both),
#   notes   — what guests get / limitations
#   source  — reference page to confirm against (Nintendo manual/support, or a reputable wiki)
#   verify  — true = NOT yet confirmed by a human; pipeline still imports it but lists it under
#             "needs review" in data/build/report.md and validate.py prints the count.
#
# Entries with verify: false were corroborated by two independent references during Step 2;
# a human should still spot-check the source pages (see plan → Manual verification).
#
# Known NON-supporters (do not add): Super Smash Bros. for Nintendo 3DS, New Super Mario Bros. 2,
# Kid Icarus: Uprising, Monster Hunter 4 Ultimate (each player needs their own copy).

